<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Demo US-16 — Trilha de Aprovação e Versionamento</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --surface: #ffffff;
      --border: #d7dee8;
      --text: #17212b;
      --muted: #5a6777;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --pass-bg: #dcfce7;
      --pass-fg: #166534;
      --pass-bd: #86efac;
      --fail-bg: #fee2e2;
      --fail-fg: #991b1b;
      --fail-bd: #fca5a5;
      --block-bg: #fef3c7;
      --block-fg: #92400e;
      --block-bd: #fcd34d;
      --code-bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      background: #0f172a;
      color: #f8fafc;
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    header h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }
    header p {
      margin: 3px 0 0;
      font-size: 13px;
      color: #cbd5e1;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: #eef2f6; }
    .btn-reset {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #475569;
    }
    .btn-reset:hover:not(:disabled) { background: #334155; }
    .btn-tab {
      background: var(--surface);
      color: var(--muted);
      border-color: var(--border);
      padding: 6px 12px;
      font-size: 12px;
    }
    .btn-tab.active {
      background: #1e293b;
      color: #fff;
      border-color: #1e293b;
    }
    main {
      max-width: 1220px;
      margin: 20px auto;
      padding: 0 20px 48px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .kpi-card:hover { border-color: #94a3b8; }
    .kpi-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
    }
    .kpi-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .summary-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .badge-pass { background: var(--pass-bg); color: var(--pass-fg); border-color: var(--pass-bd); }
    .badge-fail { background: var(--fail-bg); color: var(--fail-fg); border-color: var(--fail-bd); }
    .badge-block { background: var(--block-bg); color: var(--block-fg); border-color: var(--block-bd); }
    .badge-idle { background: #e2e8f0; color: #334155; border-color: #cbd5e1; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .card-head {
      padding: 14px 18px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-code {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--primary);
      letter-spacing: 0.04em;
    }
    .card-title { margin: 2px 0 4px; font-size: 16px; font-weight: 700; }
    .card-rule { margin: 0; font-size: 13px; color: var(--muted); }
    .card-actions { display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 16px 18px; }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    .box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--code-bg);
    }
    .box h4 {
      margin: 0 0 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }
    th {
      background: #f1f5f9;
      font-size: 12px;
      color: #334155;
      font-weight: 700;
    }
    tr:last-child td { border-bottom: none; }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .hash-pill {
      display: block;
      background: #0f172a;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      word-break: break-all;
      margin-top: 4px;
    }
    pre {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #0f172a;
    }
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .step-item {
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff;
    }
    .step-item.OK { border-left-color: #16a34a; }
    .step-item.BLOQUEADO { border-left-color: #d97706; background: #fffbeb; }
    .step-item.ERRO { border-left-color: #dc2626; background: #fef2f2; }
    .step-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .step-msg { font-size: 13px; color: #1e293b; margin: 2px 0 0; }
    .alert {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      border: 1px solid transparent;
    }
    .alert-ok { background: var(--pass-bg); color: var(--pass-fg); border-color: var(--pass-bd); }
    .alert-block { background: var(--block-bg); color: var(--block-fg); border-color: var(--block-bd); }
    .alert-fail { background: var(--fail-bg); color: var(--fail-fg); border-color: var(--fail-bd); }
    .empty-state { font-size: 13px; color: var(--muted); font-style: italic; }
    .meta-foot { margin-top: 10px; font-size: 11px; color: var(--muted); text-align: right; }
    details { margin-top: 10px; }
    summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--primary); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>US-16 — Trilha de Aprovação e Versionamento</h1>
      <p>Validação visual com funções reais do backend e banco SQLite isolado (RN-04, RN-67, RN-68, RNF-54)</p>
    </div>
    <div class="toolbar">
      <button class="btn-reset" id="btn-reset">Restaurar Ambiente</button>
      <button class="btn-primary" id="btn-run-all">Executar Todos os 5 Cenários</button>
    </div>
  </header>

  <main>
    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="summary-bar">
      <div id="summary-text">Clique em <strong>Executar Todos os 5 Cenários</strong> ou execute cada critério individualmente.</div>
      <div id="summary-badge"><span class="badge badge-idle">0 / 5 executados</span></div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="cards"></div>
  </main>

  <script>
    const state = {
      metas: [],
      resultados: {},
      filtro: 'all',
      bannerMsg: null,
    };

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtMoeda(v) {
      const n = Number(v || 0);
      return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function badgeStatus(status) {
      if (status === 'PASSOU') return '<span class="badge badge-pass">APROVADO</span>';
      if (status === 'FALHOU') return '<span class="badge badge-fail">FALHOU</span>';
      return '<span class="badge badge-idle">PENDENTE</span>';
    }

    function badgePasso(res) {
      if (res === 'OK') return '<span class="badge badge-pass">OK</span>';
      if (res === 'BLOQUEADO') return '<span class="badge badge-block">REJEIÇÃO ESPERADA</span>';
      return '<span class="badge badge-fail">ERRO</span>';
    }

    function renderDestaque(r) {
      const d = r.destaqueVisual || {};
      if (!d.tipo) return '';

      if (d.tipo === 'TRILHA_ETAPAS') {
        const rows = (d.etapas || []).map((e) => `
          <tr>
            <td><strong>${escapeHtml(e.etapa)}</strong></td>
            <td>${escapeHtml(e.responsavel || '-')}</td>
            <td class="mono">${escapeHtml(e.dataHora || '-')}</td>
            <td><span class="badge badge-pass">${escapeHtml(e.status)}</span></td>
          </tr>
        `).join('');
        return `
          <div class="box" style="margin-bottom: 14px;">
            <h4>Trilha de Aprovação da Competência ${escapeHtml(d.competencia)} (Situação: ${escapeHtml(d.situacaoAtual)})</h4>
            <table>
              <thead>
                <tr><th>Etapa</th><th>Responsável</th><th>Data e Hora</th><th>Status</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      if (d.tipo === 'DEVOLUCAO') {
        return `
          <div class="alert alert-block">
            <strong>Rejeição sem motivo:</strong> ${escapeHtml(d.rejeicaoSemMotivo)}
          </div>
          <div class="grid-2">
            <div class="box">
              <h4>Antes da Devolução</h4>
              <pre>${escapeHtml(JSON.stringify(d.antes, null, 2))}</pre>
            </div>
            <div class="box">
              <h4>Depois da Devolução (ABERTA + Conferência Invalidada)</h4>
              <pre>${escapeHtml(JSON.stringify(d.depois, null, 2))}</pre>
            </div>
          </div>
          <div class="box" style="margin-bottom: 14px;">
            <h4>Registro de Auditoria (DEVOLVER_FOLHA_AJUSTE)</h4>
            <pre>${escapeHtml(JSON.stringify(d.logAuditoria, null, 2))}</pre>
          </div>
        `;
      }

      if (d.tipo === 'SNAPSHOT_V1') {
        const verbasRows = (d.verbasColaborador || []).map((v) => `
          <tr>
            <td>${escapeHtml(v.descricao)}</td>
            <td>${escapeHtml(v.natureza)}</td>
            <td>${fmtMoeda(v.valor)}</td>
          </tr>
        `).join('');
        return `
          <div class="alert ${d.hashIntegro ? 'alert-ok' : 'alert-fail'}">
            <strong>Verificação Criptográfica:</strong> ${d.hashIntegro ? 'Hash SHA-256 conferido contra dados_json armazenados' : 'Divergência no hash!'} (${escapeHtml(d.hashTamanho)} caracteres)
          </div>
          <div class="grid-2">
            <div class="box">
              <h4>Identificação da Versão ${escapeHtml(d.versao)}</h4>
              <div><strong>Fechamento:</strong> <span class="mono">${escapeHtml(d.fechadoEm)}</span></div>
              <div style="margin-top:6px;"><strong>Hash SHA-256 armazenado:</strong><span class="hash-pill">${escapeHtml(d.hashArmazenado)}</span></div>
              <div style="margin-top:6px;"><strong>Hash SHA-256 recalculado:</strong><span class="hash-pill">${escapeHtml(d.hashRecalculado)}</span></div>
            </div>
            <div class="box">
              <h4>Totais & Responsáveis no Snapshot</h4>
              <pre>${escapeHtml(JSON.stringify({ totais: d.totais, usuarios: d.usuarios, qtdParametros: d.qtdParametros }, null, 2))}</pre>
            </div>
          </div>
          <div class="grid-2">
            <div class="box">
              <h4>Valores / Verbas do Colaborador</h4>
              <table>
                <thead><tr><th>Verba</th><th>Natureza</th><th>Valor</th></tr></thead>
                <tbody>${verbasRows}</tbody>
              </table>
            </div>
            <div class="box">
              <h4>Eventos & Parâmetros Capturados</h4>
              <pre>${escapeHtml(JSON.stringify({ eventos: d.eventos, amostraParametros: d.amostraParametros }, null, 2))}</pre>
            </div>
          </div>
        `;
      }

      if (d.tipo === 'COMPARACAO_V1_V2') {
        return `
          <div class="alert ${d.v1Intacta ? 'alert-ok' : 'alert-fail'}">
            <strong>Preservação Histórica:</strong> ${d.v1Intacta ? 'Snapshot e Hash SHA-256 da V1 permaneceram 100% inalterados após geração da V2.' : 'V1 foi alterada!'}
            | <strong>Justificativa da reabertura:</strong> ${escapeHtml(d.justificativaReabertura)}
          </div>
          <div class="box" style="margin-bottom: 14px;">
            <h4>Comparação Visual V1 vs V2</h4>
            <table>
              <thead>
                <tr><th>Atributo</th><th>Versão V1 (Original)</th><th>Versão V2 (Após Reabertura)</th></tr>
              </thead>
              <tbody>
                <tr><td><strong>Data/Hora Fechamento</strong></td><td class="mono">${escapeHtml(d.v1.dataHora)}</td><td class="mono">${escapeHtml(d.v2.dataHora)}</td></tr>
                <tr><td><strong>Eventos</strong></td><td>${escapeHtml(d.v1.qtdEventos)}</td><td>${escapeHtml(d.v2.qtdEventos)}</td></tr>
                <tr><td><strong>Proventos</strong></td><td>${fmtMoeda(d.v1.totais.proventos)}</td><td>${fmtMoeda(d.v2.totais.proventos)}</td></tr>
                <tr><td><strong>Descontos</strong></td><td>${fmtMoeda(d.v1.totais.descontos)}</td><td>${fmtMoeda(d.v2.totais.descontos)}</td></tr>
                <tr><td><strong>Líquido</strong></td><td><strong>${fmtMoeda(d.v1.totais.liquido)}</strong></td><td><strong>${fmtMoeda(d.v2.totais.liquido)}</strong> (${d.diferencaLiquido >= 0 ? '+' : ''}${fmtMoeda(d.diferencaLiquido)})</td></tr>
                <tr><td><strong>Hash SHA-256</strong></td><td class="mono">${escapeHtml(d.v1.hashSha256)}</td><td class="mono">${escapeHtml(d.v2.hashSha256)}</td></tr>
              </tbody>
            </table>
          </div>
        `;
      }

      if (d.tipo === 'CONSULTA_DIRETORIA') {
        const relRows = (d.relatorios || []).map((rel) => `
          <tr>
            <td><strong>${escapeHtml(rel.nome)}</strong></td>
            <td><span class="badge badge-pass">${escapeHtml(rel.versao)}</span></td>
            <td>${fmtMoeda(rel.totalLiquido)}</td>
            <td class="mono">${escapeHtml(rel.hashSha256)}</td>
          </tr>
        `).join('');
        return `
          <div class="box" style="margin-bottom: 14px;">
            <h4>Relatórios Gerenciais com Versão e Hash (Visão Diretoria)</h4>
            <table>
              <thead><tr><th>Relatório</th><th>Versão</th><th>Total Líquido</th><th>Hash SHA-256</th></tr></thead>
              <tbody>${relRows}</tbody>
            </table>
          </div>
          <div class="box" style="margin-bottom: 14px;">
            <h4>Comparação de Contracheques Históricos (V1 vs V2)</h4>
            <table>
              <thead><tr><th>Indicador</th><th>Contracheque V1</th><th>Contracheque V2</th></tr></thead>
              <tbody>
                <tr><td><strong>Versão</strong></td><td>${escapeHtml(d.contrachequeV1.versao)}</td><td>${escapeHtml(d.contrachequeV2.versao)}</td></tr>
                <tr><td><strong>Total Proventos</strong></td><td>${fmtMoeda(d.contrachequeV1.totais.totalProventos)}</td><td>${fmtMoeda(d.contrachequeV2.totais.totalProventos)}</td></tr>
                <tr><td><strong>Total Descontos</strong></td><td>${fmtMoeda(d.contrachequeV1.totais.totalDescontos)}</td><td>${fmtMoeda(d.contrachequeV2.totais.totalDescontos)}</td></tr>
                <tr><td><strong>Líquido</strong></td><td><strong>${fmtMoeda(d.contrachequeV1.totais.liquido)}</strong></td><td><strong>${fmtMoeda(d.contrachequeV2.totais.liquido)}</strong></td></tr>
                <tr><td><strong>Hash SHA-256</strong></td><td class="mono">${escapeHtml(d.contrachequeV1.hashSha256)}</td><td class="mono">${escapeHtml(d.contrachequeV2.hashSha256)}</td></tr>
              </tbody>
            </table>
          </div>
        `;
      }

      return '';
    }

    function render() {
      const total = state.metas.length;
      const execs = Object.values(state.resultados);
      const passou = execs.filter((r) => r.status === 'PASSOU').length;
      const falhou = execs.filter((r) => r.status === 'FALHOU').length;

      document.getElementById('kpi-grid').innerHTML = state.metas.map((m) => {
        const r = state.resultados[m.id];
        return `
          <div class="kpi-card" onclick="selecionarFiltro(${m.id})">
            <div class="kpi-top">
              <span>${escapeHtml(m.codigo)}</span>
              ${badgeStatus(r ? r.status : null)}
            </div>
            <div class="kpi-title">${escapeHtml(m.titulo)}</div>
          </div>
        `;
      }).join('');

      const summaryEl = document.getElementById('summary-text');
      const badgeEl = document.getElementById('summary-badge');

      if (state.bannerMsg) {
        summaryEl.innerHTML = escapeHtml(state.bannerMsg);
      } else if (execs.length === 0) {
        summaryEl.innerHTML = 'Clique em <strong>Executar Todos os 5 Cenários</strong> ou execute um critério individualmente.';
      } else {
        summaryEl.innerHTML = `Resultado real: <strong>${passou}</strong> aprovado(s), <strong>${falhou}</strong> reprovado(s) de ${total} critério(s).`;
      }

      if (execs.length === 0) {
        badgeEl.innerHTML = `<span class="badge badge-idle">0 / ${total} executados</span>`;
      } else if (falhou > 0) {
        badgeEl.innerHTML = `<span class="badge badge-fail">${passou} / ${total} APROVADOS (${falhou} FALHA)</span>`;
      } else {
        badgeEl.innerHTML = `<span class="badge badge-pass">${passou} / ${total} APROVADOS</span>`;
      }

      const tabsEl = document.getElementById('tabs');
      tabsEl.innerHTML =
        `<button class="btn-tab ${state.filtro === 'all' ? 'active' : ''}" onclick="selecionarFiltro('all')">Todos (${total})</button>` +
        state.metas.map((m) =>
          `<button class="btn-tab ${state.filtro === m.id ? 'active' : ''}" onclick="selecionarFiltro(${m.id})">Critério ${m.id}</button>`
        ).join('');

      const visiveis = state.metas.filter((m) => state.filtro === 'all' || state.filtro === m.id);
      document.getElementById('cards').innerHTML = visiveis.map((m) => {
        const r = state.resultados[m.id];
        const passosHtml = r
          ? r.passos.map((p) => `
              <div class="step-item ${p.resultado}">
                <div class="step-top">
                  <span>${escapeHtml(p.etapa)}</span>
                  ${badgePasso(p.resultado)}
                </div>
                <div class="step-msg">${escapeHtml(p.mensagem)}</div>
              </div>
            `).join('')
          : '<div class="empty-state">Aguardando execução deste critério.</div>';

        const erroHtml = r && r.erroValidacao
          ? `<div class="alert alert-fail"><strong>Falha real detectada no backend:</strong> ${escapeHtml(r.erroValidacao)}</div>`
          : '';

        const dbHtml = r
          ? `<details><summary>Ver evidências brutas do banco SQLite isolado</summary><div class="box" style="margin-top:8px;"><pre>${escapeHtml(JSON.stringify(r.evidenciasDb, null, 2))}</pre></div></details>`
          : '';

        const footHtml = r
          ? `<div class="meta-foot">Executado em ${escapeHtml(r.executadoEm)} (${r.duracaoMs} ms)</div>`
          : '';

        return `
          <section class="card">
            <div class="card-head">
              <div>
                <div class="card-code">${escapeHtml(m.codigo)}</div>
                <h2 class="card-title">${escapeHtml(m.titulo)}</h2>
                <p class="card-rule">${escapeHtml(m.regra)}</p>
              </div>
              <div class="card-actions">
                ${badgeStatus(r ? r.status : null)}
                <button class="btn-secondary" onclick="executarUm(${m.id})">Executar Cenário ${m.id}</button>
              </div>
            </div>
            <div class="card-body">
              ${erroHtml}
              ${r ? renderDestaque(r) : ''}
              <div class="steps-list">${passosHtml}</div>
              ${dbHtml}
              ${footHtml}
            </div>
          </section>
        `;
      }).join('');
    }

    window.selecionarFiltro = function (filtro) {
      state.filtro = filtro;
      render();
    };

    window.executarUm = async function (id) {
      state.bannerMsg = null;
      const resp = await fetch(`/api/run/${id}`, { method: 'POST' });
      const data = await resp.json();
      if (resp.ok) {
        state.resultados[data.id] = data;
      } else {
        alert(data.erro || 'Erro ao executar cenário');
      }
      render();
    };

    document.getElementById('btn-run-all').addEventListener('click', async () => {
      const btn = document.getElementById('btn-run-all');
      btn.disabled = true;
      btn.textContent = 'Executando...';
      state.bannerMsg = null;
      try {
        const resp = await fetch('/api/run-all', { method: 'POST' });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.erro || 'Erro ao executar cenários');
        state.resultados = {};
        for (const r of data.resultados) {
          state.resultados[r.id] = r;
        }
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Executar Todos os 5 Cenários';
        render();
      }
    });

    document.getElementById('btn-reset').addEventListener('click', async () => {
      const resp = await fetch('/api/reset', { method: 'POST' });
      const data = await resp.json();
      if (resp.ok) {
        state.resultados = {};
        state.filtro = 'all';
        state.bannerMsg = data.mensagem;
      }
      render();
    });

    (async () => {
      const resp = await fetch('/api/scenarios');
      const data = await resp.json();
      state.metas = data.cenarios || [];
      for (const r of data.resultados || []) {
        state.resultados[r.id] = r;
      }
      render();
    })();
  </script>
</body>
</html>
